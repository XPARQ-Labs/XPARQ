[workspace]
resolver = "3"
members = [
    "core",
    "node",
    "wallet",
]
exclude = [
    "depend",
    "core/fuzz",
]

[workspace.package]
version = "0.2.13"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/XPARQ-Labs/XPARQ"

[profile.bench]
debug = true

[workspace.dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"], path = "depend/argon2/argon2" }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
async-trait = "0.1"
bip39 = "2.2"
bech32 = { version = "0.12.0", default-features = false, features = ["alloc"], path = "depend/bech32" }
borsh = { version = "1.5", features = ["derive"], path = "depend/traits/borsh" }
chacha20 = { version = "0.10.1", default-features = false, features = ["rng", "zeroize"], path = "depend/sqisign/chacha20-0.10.1" }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
ctrlc = "3.4"
futures-util = "0.3"
getrandom = { version = "0.4.3", default-features = false }
hex = "0.4"
igd-next = "0.16"
lmdb = "0.8"
libp2p = { version = "0.54", default-features = false, features = ["identify", "kad", "macros", "noise", "ping", "request-response", "tcp", "tokio", "yamux"] }
ml_dsa = { package = "ml-dsa", version = "0.1.1", default-features = false, features = ["alloc", "getrandom", "zeroize"], path = "depend/mldsa/ml-dsa" }
prost = "0.14"
protoc-bin-vendored = "3"
serde = { version = "1", features = ["derive"], path = "depend/traits/serde" }
serde_json = "1"
sha3 = { version = "0.12.0", default-features = false, path = "depend/sha3/sha3" }
socket2 = "0.6"
sqisign_rs = { package = "xparq-sqisign", version = "0.1.0", path = "depend/sqisign/sqisign-rs" }
static_assertions = { version = "1.1.0", path = "depend/utils/static_assertions" }
tokio = { version = "1", features = ["full"] }
time = { version = "0.3.55", features = ["formatting", "macros"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout"] }
zeroize = { version = "1.9.0", features = ["alloc", "derive"], path = "depend/traits/zeroize" }
rand_10 = { package = "rand", version = "0.10.2", features = ["sys_rng"], path = "depend/sqisign/rand-0.10" }

xparq = { path = "core", default-features = false }

[patch.crates-io]
serde = { path = "depend/traits/serde" }
serde_core = { path = "depend/traits/serde_core" }
serde_derive = { path = "depend/traits/serde_derive" }
autocfg = { path = "depend/utils/autocfg" }
block-buffer = { path = "depend/utils/block-buffer" }
crypto-bigint = { path = "depend/sqisign/crypto-bigint-0.7" }
crypto-common = { path = "depend/utils/crypto-common-0.1.7" }
digest = { path = "depend/traits/digest-0.10.7" }
generic-array = { path = "depend/utils/generic-array" }
hybrid-array = { path = "depend/utils/hybrid-array" }
libm = { path = "depend/sqisign/libm" }
num-bigint = { path = "depend/sqisign/num-bigint-0.5" }
num-integer = { path = "depend/sqisign/num-integer" }
num-traits = { path = "depend/traits/num-traits" }
paste = { path = "depend/sqisign/paste" }
proc-macro2 = { path = "depend/proc-macro/proc-macro2" }
quote = { path = "depend/proc-macro/quote" }
rand = { path = "depend/sqisign/rand-0.10" }
rand_core = { path = "depend/traits/rand_core" }
signature = { path = "depend/traits/signature" }
chacha20 = { path = "depend/sqisign/chacha20-0.10.1" }
cpubits = { path = "depend/utils/cpubits" }
ctutils = { path = "depend/utils/ctutils" }
subtle = { path = "depend/utils/subtle" }
syn = { path = "depend/proc-macro/syn-2.0.119" }
typenum = { path = "depend/utils/typenum" }
unicode-ident = { path = "depend/proc-macro/unicode-ident" }
version_check = { path = "depend/utils/version_check" }
zeroize_derive = { path = "depend/traits/zeroize_derive" }
