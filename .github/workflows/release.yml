name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || exit 1
          expected="${BASH_REMATCH[1]}"
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          runtime="$(jq -r '.packages[] | select(.name == "xparq-runtime") | .version' <<<"${metadata}")"
          wallet="$(jq -r '.packages[] | select(.name == "wallet") | .version' <<<"${metadata}")"
          [[ "${runtime}" == "${expected}" && "${wallet}" == "${expected}" ]]
      - name: Test workspace including network E2E
        run: cargo test --workspace --locked -- --test-threads=1

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p xparq-runtime -p wallet
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package="xparq-${GITHUB_REF_NAME}-mainnet-${{ matrix.platform }}"
          mkdir -p "dist/${package}"
          install -m 0755 "target/${{ matrix.target }}/release/node" "dist/${package}/node"
          install -m 0755 "target/${{ matrix.target }}/release/wallet" "dist/${package}/wallet"
          cp README.md runtime/README.md wallet/README.md CHANGELOG.md LICENSE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "xparq-$env:GITHUB_REF_NAME-mainnet-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/node.exe","target/${{ matrix.target }}/release/wallet.exe","README.md","runtime/README.md","wallet/README.md","CHANGELOG.md","LICENSE" "dist/$package"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --latest
