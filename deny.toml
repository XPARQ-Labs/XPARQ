# Run each network feature set independently; defaults select mainnet.
[graph]
all-features = false

[advisories]
version = 2
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# SPDX identifiers used by the current dependency graph.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Parallel versions already exist; report them without hiding individual crates.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
