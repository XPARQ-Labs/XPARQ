syntax = "proto3";

package xparq.node.v1;

service NodeRpc {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  string network = 1;
  string chain_name = 2;
  string coin_name = 3;
  string protocol_stage = 4;
  uint32 protocol_version = 5;
  uint64 height = 6;
  string tip_hash = 7;
  uint64 peers = 8;
  bool mining = 9;
  uint64 min_relay_fee = 10;
  uint64 market_fee = 11;
}
