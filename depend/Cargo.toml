[workspace]
resolver = "3"
members = []

# Cargo needs concrete package paths here; wildcard exclusions do not isolate
# these vendored packages when tools inspect their manifests directly.
exclude = [
    "network/litep2p",
    "slhdsa/slh-dsa",
    "slhdsa/hmac",
    "slhdsa/sha2",
    "utils/block-buffer-0.12",
    "argon2/argon2",
    "argon2/blake2",
    "fn-dsa/fn-dsa",
    "fn-dsa/fn-dsa-comm",
    "fn-dsa/fn-dsa-kgen",
    "fn-dsa/fn-dsa-sign",
    "fn-dsa/fn-dsa-vrfy",
    "keccak",
    "mldsa/ml-dsa",
    "mldsa/module-lattice",
    "mldsa/shake",
    "proc-macro/proc-macro-crate",
    "proc-macro/proc-macro2",
    "proc-macro/quote",
    "proc-macro/syn",
    "proc-macro/syn-2.0.119",
    "proc-macro/toml_datetime",
    "proc-macro/toml_edit",
    "proc-macro/toml_parser",
    "proc-macro/unicode-ident",
    "proc-macro/winnow",
    "sha3/sha3",
