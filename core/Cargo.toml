[package]
name = "xparq"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
autobenches = false
description = "Consensus primitives for the XPARQ proof-of-work blockchain, Sharksphere patch"
readme = "README.md"
repository = "https://github.com/XPARQ-Labs/XPARQ"
license = "MIT"
keywords = ["blockchain", "proof-of-work", "post-quantum", "ml-dsa", "sha3"]
categories = ["cryptography::cryptocurrencies"]

[package.metadata]
patch = "Sharksphere"

[features]
default = ["mainnet"]
mainnet = []
testnet = []
devnet = ["sqisign-blockchain-test"]
# Staging only. SQIsign is still a NIST Round 3 candidate and MUST NOT be used
# by consensus until a final NIST standard and an explicit network upgrade.
sqisign-candidate = ["dep:rand_10", "dep:sqisign_rs"]
# Process-wide heap scrubbing for SQIsign arithmetic intermediates.
sqisign-secure-memory = ["sqisign-candidate"]
# Development-chain default. This remains experimental and chain-format
# breaking; never combine its database or network with an ML-DSA chain.
sqisign-blockchain-test = ["sqisign-candidate", "sqisign-secure-memory", "dep:chacha20"]

[dependencies]
sha3.workspace = true
ml_dsa.workspace = true
sqisign_rs = { workspace = true, optional = true }
rand_10 = { workspace = true, optional = true }
chacha20 = { workspace = true, optional = true }
borsh.workspace = true
serde.workspace = true
bech32.workspace = true
zeroize.workspace = true
static_assertions.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true

[[bench]]
name = "sqisign_candidate"
harness = false
required-features = ["sqisign-candidate"]

[[bench]]
name = "sqisign_verifier"
harness = false
required-features = ["sqisign-blockchain-test"]

[[bench]]
name = "core_consensus"
harness = false
