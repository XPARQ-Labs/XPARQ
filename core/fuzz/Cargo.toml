[package]
name = "xparq-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
members = ["."]

[package.metadata]
cargo-fuzz = true

[features]
default = ["mainnet"]
mainnet = ["xparq/mainnet"]
testnet = ["xparq/testnet"]
devnet = ["xparq/devnet"]
sqisign-parser = ["dep:sqisign_rs"]

[dependencies]
libfuzzer-sys = "0.4"
xparq = { path = "..", default-features = false }
sqisign_rs = { package = "xparq-sqisign", path = "../../depend/sqisign/sqisign-rs", optional = true }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_protocol"
path = "fuzz_targets/decode_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_block"
path = "fuzz_targets/decode_block.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "state_transition"
path = "fuzz_targets/state_transition.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qcash_lifecycle"
path = "fuzz_targets/qcash_lifecycle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "commitment_mutation"
path = "fuzz_targets/commitment_mutation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mixed_family"
path = "fuzz_targets/mixed_family.rs"
test = false
doc = false
bench = false

[[bin]]
name = "address_codec"
path = "fuzz_targets/address_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "consensus_epoch"
path = "fuzz_targets/consensus_epoch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "artifact_codec"
path = "fuzz_targets/artifact_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qcash_coin_codec"
path = "fuzz_targets/qcash_coin_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sqisign_parser"
path = "fuzz_targets/sqisign_parser.rs"
test = false
doc = false
bench = false
required-features = ["sqisign-parser"]
